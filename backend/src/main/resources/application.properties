# Server Port (supports cloud PORT env var, defaults to 9090)
server.port=${PORT:9090}

# MySQL Database Configuration (Aiven MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-38b2d40e-anurag-6f0e.j.aivencloud.com:11294/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
